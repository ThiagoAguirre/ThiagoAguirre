name: Update planet

on:
  schedule: [{ cron: "0 0 * * *" }] # every day at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  planet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: ThiagoAguirre/git-planet@v1
        with:
          window: annual
